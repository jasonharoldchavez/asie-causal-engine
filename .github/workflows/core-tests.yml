name: ASIE core tests

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/predictive-matrix-semantics-and-validation"
      - "feat/canonical-matrix-edge-adapter"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install predictor dependencies
        run: python -m pip install numpy scipy
      - name: Run core validation tests
        run: python -m unittest discover -s tests -p "test_core_validation.py" -v
      - name: Run matrix orientation tests
        run: python -m unittest discover -s tests -p "test_matrix_orientation.py" -v
