name: ASIE Lumen integration

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/lumen-sdk-pipeline-integration"

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy aiosqlite
      - name: Install current Lumen SDK source
        run: python -m pip install git+https://github.com/jasonharoldchavez/lumen-sdk.git
      - name: Run pipeline integration tests
        run: python -m unittest discover -s tests -p "test_pipeline_integration.py" -v
